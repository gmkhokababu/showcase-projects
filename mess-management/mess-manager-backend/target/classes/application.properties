# Server
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/mess_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT (Reusable Auth Module)
app.jwt.secret=mySecretKeyMySecretKeyMySecretKeyMySecretKey
app.jwt.expiration-ms=86400000

# CORS (for Angular frontend)
cors.allowed-origins=http://localhost:4200
