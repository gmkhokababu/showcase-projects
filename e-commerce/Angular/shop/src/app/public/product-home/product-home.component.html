<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-4 g-4 pb-5">
  
  <div class="col" *ngFor="let product of products">
    <div class="card h-100 product-glass-card" (click)="viewProductDetails(product.id)">
      
      <div class="product-img-wrapper position-relative overflow-hidden">
        <img [src]="product.image" class="card-img-top product-img" [alt]="product.name">
        <div class="img-overlay d-flex align-items-center justify-content-center">
          <span class="btn btn-sm btn-purple-view px-3" (click)="viewProductDetails(product.id)">View Details</span>
        </div>
      </div>

      <div class="card-body d-flex flex-column justify-content-between p-3">
        <div>
          <h5 class="card-title product-title mb-2 text-truncate" [title]="product.name">
            {{ product.name }}
          </h5>
          
          <div class="d-flex align-items-center mb-3">
            <div class="text-warning me-2 sm-rating-stars">
              <i class="bi bi-star-fill me-1"></i>
            </div>
            <span class="text-secondary small fw-semibold">{{ product.rating }}</span>
          </div>
        </div>

        <div class="d-flex align-items-center justify-content-between mt-auto">
          <span class="product-price">${{ product.price }}</span>
          <button class="btn btn-icon-cart" title="Add to Cart">
            <i class="bi bi-bag-plus"></i>
          </button>
        </div>
      </div>

    </div>
  </div>

</div>
