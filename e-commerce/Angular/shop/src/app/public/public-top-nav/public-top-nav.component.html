<nav class="navbar public-top-glass px-4 d-flex justify-content-between align-items-center" [class.scrolled]="isScrolled">
  
  <!-- ১. বাম পাশ: ব্র্যান্ডের নাম এবং লোগো -->
  <div class="d-flex align-items-center gap-2 brand-wrapper" type="button" (click)="home()">
    <!-- <i class="bi bi-hexagon-half brand-logo-icon"></i> একটি মডার্ন স্লিম লোগো আইকন -->
     <img class="logo " src="/favicon/favicon.svg" alt="logo">
    <span class="public-brand-title">Root Field</span>
  </div>

  <!-- ২. মাঝখানের অংশ: বড় গ্লাস সার্চ বক্স (পাবলিক পেজের মেইন ফোকাস) -->
  <div class="search-center-container d-none d-md-block">
    <div class="input-group">
      <input type="text" class="form-control public-glass-search pe-3" placeholder="Search for products, brands and more...">
      <span class="input-group-text public-search-icon-bg"><i class="bi bi-search"></i></span>
    </div>
  </div>

  <!-- ৩. ডান পাশ: কার্ট আইকন এবং লগইন বাটন -->
  <div class="d-flex align-items-center gap-3">
    
    <!-- শপিং কার্ট বাটন উইথ নোটিফিকেশন ব্যাজ -->
    <button class="btn public-cart-btn position-relative" title="Shopping Cart" (click)="cart()">
      <i class="bi bi-cart3 fs-5"></i>
      <!-- কার্টে কয়টি আইটেম আছে তার ছোট পার্পল ব্যাজ -->
      <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-purple-badge">0</span>
    </button>
    <!-- <span class="fi fi-bd"></span> -->

    <!-- Track Order button -->
    <button class="btn public-login-btn px-3 py-1.5 fw-bold" type="button" (click)="trackOrder()">
      Track Order
    </button>
    <!-- লগইন বাটন (তোমার সেই সুইটঅ্যালার্ট ট্রিলারের জন্য রেডি) -->
    <button class="btn public-login-btn px-3 py-1.5 fw-bold" type="button" (click)="openLoginAlert()">
      Login
    </button>

  </div>
</nav>
