<div class="container">
    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="card py-5 px-3 m-3 custom_card col-11 col-sm-8 col-md-6 col-lg-4 rounded">
            <form class="d-grid gap-2" (submit)="login($event)">
                <div class="mb-3">
                    <label for="username" class="form-label ">Username</label>
                    <input type="text" class="form-control glass-input" id="username" aria-describedby="emailHelp" name="username" [(ngModel)]="username">
                    <!-- <div id="emailHelp" class="form-text ">We'll never share your email with anyone else.</div> -->
                </div>
                <div class="mb-3">
                    <label for="Password" class="form-label ">Password</label>
                    <input type="password" class="form-control glass-input" id="Password" name="password" [(ngModel)]="password">
                </div>
                <hr>
                <!-- <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input glass-input" id="exampleCheck1">
                    <label class="form-check-label " for="exampleCheck1">Check me out</label>
                </div> -->
                <button type="submit" class="btn glass-btn-gradient-pm px-5 btn-lg ">Login</button>
                <!-- <button type="submit" class="btn glass-btn-gradient-pm px-5 btn-lg ">Forget Password</button> -->
                <div id="emailHelp" class="form-text my-2 mx-auto">New in here!</div>
                <button type="button" class="btn glass-btn-secondary px-5 btn-lg " (click)="Registration()">Registration</button>

            </form>
        </div>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="loginToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true" style="background: rgba(76, 29, 149, 0.6); backdrop-filter: blur(10px);">
    <div class="d-flex">
      <div class="toast-body">
        Login Successful! Welcome to Admin Panel.
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>
