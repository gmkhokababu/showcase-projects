<div class="container">
    <div class="d-flex justify-content-center align-items-center vh-100">
        <div class="card p-3 m-3 custom_card col-11 col-sm-8 col-md-6 col-lg-4 rounded">
            <form>
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label text-dark">Email address</label>
                    <input type="email" class="form-control bg-white text-dark" id="exampleInputEmail1" aria-describedby="emailHelp">
                    <div id="emailHelp" class="form-text text-dark">We'll never share your email with anyone else.</div>
                </div>
                <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label text-dark">Password</label>
                    <input type="password" class="form-control bg-white text-dark" id="exampleInputPassword1">
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input bg-white text-dark" id="exampleCheck1">
                    <label class="form-check-label text-dark" for="exampleCheck1">Check me out</label>
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </div>
</div>
