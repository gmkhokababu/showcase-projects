<div class="category-sidebar p-2 rounded">
  <!-- ক্যাটাগরি সেকশন টাইটেল -->
  <div class="category-header px-2 mb-3">
    <i class="bi bi-grid-1x2 me-2 text-purple-light"></i>
    <span class="text-white fw-bold">Categories</span>
  </div>

  <!-- *ngFor দিয়ে অ্যারে থেকে ডাইনামিক বাটন তৈরি হচ্ছে -->
  <div class="d-flex flex-column gap-1">
    <button 
      *ngFor="let cat of categories" 
      class="btn category-link d-flex align-items-center"
      [class.active]="cat.id === selectedCategoryId"
      (click)="selectCategory(cat.id)">
      <i class="bi {{ cat.icon }} me-2"></i> {{ cat.name }}
    </button>
  </div>
</div>
